  <head>

    <meta property="og:title" content="Church-OS" />
    <meta property="og:description" content="A modern, mobile-first, multi-tenant Church Management System SaaS with real attendance, automated SMS, finance, and pastoral care." />

    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        function isViteError(arg) {
          if (!arg) return false;
          var str = '';
          try {
            if (typeof arg === 'string') str = arg;
            else if (arg && typeof arg.message === 'string') str = arg.message;
            else if (arg && typeof arg.toString === 'function') str = arg.toString();
          } catch (_) {}
          if (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf("reading 'send'") !== -1 ||
            str.indexOf('WebSocket') !== -1
          ) {
            return true;
          }
          if (arg && arg.target && typeof WebSocket !== 'undefined' && arg.target instanceof WebSocket) return true;
          return false;
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteError(arguments[i])) {
              return console.debug.apply(console, arguments);
            }
          }
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteError(arguments[i])) {
              return console.debug.apply(console, arguments);
            }
          }
          return origWarn.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (isViteError(event.message) || isViteError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
